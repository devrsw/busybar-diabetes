[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "busybar-diabetes"
version = "0.1.0"
description = "SugarPixel-inspired T1 diabetes display app for Busy Bar"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "busylib>=1.0.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dexcom = ["pydexcom>=0.2.3"]

[project.scripts]
busybar-diabetes = "busybar_diabetes.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
